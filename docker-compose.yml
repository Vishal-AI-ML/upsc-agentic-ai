# ============================================================================
# UPSC Agentic AI — local production-like stack
# Brings up: backend (FastAPI), frontend (nginx SPA), Postgres, Qdrant, Redis.
# Use this to reproduce production locally before deploying to free cloud tiers.
#
#   docker compose up --build
#   API   -> http://localhost:8000  (docs: /docs, health: /health)
#   Web   -> http://localhost:8080
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upsc
      POSTGRES_PASSWORD: upsc
      POSTGRES_DB: upsc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upsc"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override to point at the compose services (win over .env)
      DATABASE_URL: postgresql://upsc:upsc@db:5432/upsc
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      WEB_CONCURRENCY: "1"
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  redisdata:
