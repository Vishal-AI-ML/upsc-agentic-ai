# Alembic configuration for UPSC AI Pro.
#
# The database URL is NOT hard-coded here. migrations/env.py resolves it at
# runtime from the app settings (DATABASE_URL, with the same normalization the
# app uses), so Alembic and the app always target the SAME database + scheme.
#
# Common commands (run from the repo root):
#   uv run alembic upgrade head                          # apply all migrations
#   uv run alembic revision --autogenerate -m "add X"    # create a migration
#   uv run alembic downgrade -1                           # roll back one step
#   uv run alembic current                                # show applied revision
#   uv run alembic history                                # list migrations

[alembic]
script_location = migrations
prepend_sys_path = .
# Leave blank: resolved dynamically in env.py from app settings.
sqlalchemy.url =

# ---------------------------------------------------------------------------
# Logging (used only when Alembic runs from the CLI).
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
