# ============================================================================
# UPSC Agentic AI — Deploy pipeline (add to .github/workflows/deploy.yml)
# Runs AFTER the existing CI quality gate. Deploys backend to Render and
# frontend to Vercel on every push to main. All creds live in GitHub Secrets.
# ============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. Reuse the offline quality gate before shipping ----
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-dummy-secret-not-for-production-32
      REQUIRE_EMAIL_VERIFICATION: "true"
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - run: uv run pytest -q

  # ---- 2. Deploy backend to Render (Deploy Hook) ----
  deploy-backend:
    name: Deploy backend → Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Wait & verify /health
        run: |
          echo "Waiting for Render to redeploy..."
          for i in $(seq 1 30); do
            sleep 15
            code=$(curl -s -o /dev/null -w "%{http_code}" "$LIVE_BASE_URL/health" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then echo "Backend healthy"; exit 0; fi
          done
          echo "Backend did not become healthy in time"; exit 1
        env:
          LIVE_BASE_URL: ${{ vars.LIVE_BASE_URL }}

  # ---- 3. Deploy frontend to Vercel ----
  deploy-frontend:
    name: Deploy frontend → Vercel
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE: ${{ vars.LIVE_BASE_URL }}/api/v1
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

# ----------------------------------------------------------------------------
# Required GitHub Secrets / Variables:
#   secrets.RENDER_DEPLOY_HOOK   Render dashboard -> service -> Settings -> Deploy Hook
#   secrets.VERCEL_TOKEN         https://vercel.com/account/tokens
#   secrets.VERCEL_ORG_ID        from `vercel link` -> .vercel/project.json
#   secrets.VERCEL_PROJECT_ID    from `vercel link` -> .vercel/project.json
#   vars.LIVE_BASE_URL           e.g. https://upsc-agentic-ai.onrender.com
# ----------------------------------------------------------------------------
