name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_llm_eval:
        description: "Run live LLM-as-judge eval"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # Nightly live LLM-as-judge eval (02:00 UTC).
    - cron: "0 2 * * *"

jobs:
  tests:
    name: Offline quality gate
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-dummy-secret-not-for-production-32
      REQUIRE_EMAIL_VERIFICATION: "true"
      GOOGLE_API_KEY: ""
      GROQ_API_KEY: ""
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        continue-on-error: true
        run: uv run ruff check src tests
      - name: Syntax check (compile every module)
        run: uv run python -m compileall -q src tests
      - name: Run offline tests
        run: uv run pytest -q


  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Format check (prettier)
        continue-on-error: true
        run: npm run lint

  llm-eval:
    name: Live LLM-as-judge faithfulness gate
    needs: tests
    runs-on: ubuntu-latest
    # Live eval requires model/vector DB secrets, so it runs only nightly or when manually requested.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_llm_eval == 'true')
    env:
      JWT_SECRET: ci-only-dummy-secret-not-for-production-32
      REQUIRE_EMAIL_VERIFICATION: "true"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_ENABLED: ${{ vars.LANGFUSE_ENABLED || 'false' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run LLM-as-judge eval with strict multi-metric + per-agent gate
        run: uv run python -m src.eval.llm_eval --gate 0.9 --report src/eval/eval_report.md --strict --relevancy-gate 0.7 --precision-gate 0.6
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: src/eval/eval_report.md
          if-no-files-found: ignore

      - name: Run retrieval-quality eval (report only)
        if: always()
        run: uv run python -m src.eval.retrieval_eval --report src/eval/retrieval_eval_report.md
      - name: Upload retrieval eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: src/eval/retrieval_eval_report.md
          if-no-files-found: ignore

  smoke-live:
    name: Live deploy smoke test
    needs: tests
    runs-on: ubuntu-latest
    # Hits the DEPLOYED service, so only on nightly schedule or manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      LIVE_BASE_URL: ${{ vars.LIVE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run live deploy smoke test
        run: uv run pytest tests/test_smoke_live.py -q
