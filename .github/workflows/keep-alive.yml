# ============================================================================
# Optional: keep the Render FREE backend awake (avoids ~50s cold starts).
# Add as .github/workflows/keep-alive.yml. Pings /health every 10 min.
# NOTE: this consumes Render free instance-hours; a single free web service is
# eligible for 750 hrs/mo which is enough for one always-pinged service.
# Alternative (zero GH minutes): use https://uptimerobot.com or cron-job.org.
# ============================================================================
name: Keep Alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS "${{ vars.LIVE_BASE_URL }}/health" || true
